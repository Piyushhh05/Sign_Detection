<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Sign Prediction</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100%;
      overflow-x: hidden;
      font-family: "Libre Baskerville", serif;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      animation: gradientShift 10s infinite alternate;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    h1 {
      font-size: 4rem;
      color: #2c3e50;
      margin: 30px 0 20px;
      text-align: center;
      animation: fadeInTop 1s ease forwards;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1.5s ease forwards;
    }

    .video-container {
      animation: zoomIn 1.2s ease;
    }

    .video-feed {
      width: 90vw;
      height: 75vh;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease-in-out;
    }

    .video-feed:hover {
      transform: scale(1.01);
    }

    .prediction-box {
      margin-top: 30px;
      padding: 20px 30px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(12px);
      text-align: center;
      max-width: 600px;
      width: 90%;
      transition: box-shadow 0.3s ease;
      animation: slideUp 1.3s ease forwards;
    }

    .prediction-box:hover {
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.2);
    }

    .prediction-box h3 {
      font-size: 1.8rem;
      color: #2c3e50;
      margin: 0;
    }

    .prediction-box #prediction {
      font-size: 1.5rem;
      font-weight: bold;
      color: #0d47a1;
      margin-top: 10px;
    }

    /* Animations */
    @keyframes fadeInTop {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Live Sign Prediction</h1>
  <div class="main-content">
    <div class="video-container">
      <img class="video-feed" src="{{ url_for('video_feed') }}" alt="Live Webcam Feed">
    </div>

    <div class="prediction-box">
      <h3>Predicted Sign</h3>
      <div id="prediction">...</div>
    </div>
  </div>

  <script>
    setInterval(() => {
      fetch('/get_prediction')
        .then(res => res.json())
        .then(data => {
          document.getElementById("prediction").textContent = data.prediction;
        });
    }, 1000);
  </script>
</body>
</html>
